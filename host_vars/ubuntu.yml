ansible_user: jwatkins
ansible_host: ubuntu
ansible_connection: local

group_list:
  - name: docker
    become: true

user_list:
  - name: jwatkins
    groups: [sudo, docker]
    become: true

keyring_dir: /etc/apt/keyrings
docker_keyring: "{{ keyring_dir }}/docker.asc"
datastore_mount: /mnt/md5
docker_configs: "{{ datastore_mount }}/config"

downloads:
  - url: https://download.docker.com/linux/ubuntu/gpg
    dest: "{{ docker_keyring }}"

files_early:
  - path: "{{ lookup('env', 'HOME') }}/repos"
    state: directory
  - src: "{{ role_path }}/files/.gitconfig"
    path: "{{ lookup('env', 'HOME') }}/.gitconfig"
    state: link
    force: true
  - src: "{{ role_path }}/files/.bashrc"
    path: "{{ lookup('env', 'HOME') }}/.bashrc"
    state: link
    force: true
  - src: .bash_aliases
    path: "{{ lookup('env', 'HOME') }}/.bash_aliases"
    state: link
    force: true
  - src: .bash_variables
    path: "{{ lookup('env', 'HOME') }}/.bash_variables"
    state: link
    force: true
  - src: "{{ role_path }}/files/sshd_config"
    path: /etc/ssh/sshd_config
    state: link
    become: true
    force: true
  - path: "{{ keyring_dir }}"
    state: directory
    mode: '0755'
  - path: "{{ docker_keyring }}"
    state: directory
    mode: 'a+r'
  - dest: "{{ lookup('env', 'HOME') }}/.hushlogin"
    content: ''
    cp: true
  - path: "{{ datastore_mount }}"
    state: directory

files_late:
  - path: "{{ docker_configs }}/compose.yml"
    src: "{{ playbook_dir }}/compose.yml"
    state: link
    force: true
  - path: "{{ docker_configs }}/ollama"
    state: directory
  - path: "{{ docker_configs }}/open-webui"
    state: directory
  - path: "{{ docker_configs }}/pihole"
    state: directory
  - path: "{{ docker_configs }}/plex"
    state: directory
  - src: "{{ datastore_mount }}"
    path: "{{ lookup('env', 'HOME') }}/ds"
    state: link
    force: true

virtualenv_path: ~/venv

apt_repositories:
  - repo: "deb [{{ 'arch=amd64 ' if ansible_facts['architecture'] == 'x86_64' else '' }}signed-by={{ docker_keyring }}] https://download.docker.com/linux/ubuntu {{ ansible_facts.lsb.codename }} stable"

apt_packages:
  - curl
  - ca-certificates
  - python3-pip
  - python3-venv
  - mdadm
  - net-tools

pip:
  - ansible

mounts:
  - src: /dev/md5
    path: "{{ datastore_mount }}"
    state: mounted
    fstype: ext4
