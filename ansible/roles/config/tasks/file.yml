- block:
    - name: Configure file "{{ file.path | default(file.dest) }}"
      ansible.builtin.file:
        access_time: "{{ file.access_time | default(omit) }}"
        access_time_format: "{{ file.access_time_format | default(omit) }}"
        attributes: "{{ file.attributes | default(omit) }}"
        follow: "{{ file.follow | default(omit) }}"
        force: "{{ file.force | default(omit) }}"
        group: "{{ file.group | default(omit) }}"
        mode: "{{ file.mode | default(omit) }}"
        modification_time: "{{ file.modification_time | default(omit) }}"
        modification_time_format: "{{ file.modification_time_format | default(omit) }}"
        owner: "{{ file.owner | default(omit) }}"
        path: "{{ file.path | default(omit) }}"
        recurse: "{{ file.recurse | default(omit) }}"
        selevel: "{{ file.selevel | default(omit) }}"
        serole: "{{ file.serole | default(omit) }}"
        setype: "{{ file.setype | default(omit) }}"
        seuser: "{{ file.seuser | default(omit) }}"
        src: "{{ file.src | default(omit) }}"
        state: "{{ file.state | default(omit) }}"
        unsafe_writes: "{{ file.unsafe_writes | default(omit) }}"
      when: not file.cp | default(false)
      become: "{{ file.become | default(false) }}"
      register: set_file
      failed_when:
        - file.required | default(false)
        - set_file is failed

    - name: Copy file "{{ file.dest | default(file.path) }}"
      ansible.builtin.copy:
        attributes: "{{ file.attributes | default(omit) }}"
        backup: "{{ file.backup | default(omit) }}"
        checksum: "{{ file.checksum | default(omit) }}"
        content: "{{ file.content | default(omit) }}"
        decrypt: "{{ file.decrypt | default(omit) }}"
        dest: "{{ file.dest | default(omit) }}"
        directory_mode: "{{ file.directory_mode | default(omit) }}"
        follow: "{{ file.follow | default(omit) }}"
        force: "{{ file.force | default(omit) }}"
        group: "{{ file.group | default(omit) }}"
        local_follow: "{{ file.local_follow | default(omit) }}"
        mode: "{{ file.mode | default(omit) }}"
        owner: "{{ file.owner | default(omit) }}"
        remote_src: "{{ file.remote_src | default(omit) }}"
        selevel: "{{ file.selevel | default(omit) }}"
        serole: "{{ file.serole | default(omit) }}"
        setype: "{{ file.setype | default(omit) }}"
        seuser: "{{ file.seuser | default(omit) }}"
        src: "{{ file.src | default(omit) }}"
        unsafe_writes: "{{ file.unsafe_writes | default(omit) }}"
        validate: "{{ file.validate | default(omit) }}"
      when: file.cp | default(false)
      become: "{{ file.become | default(false) }}"
      register: copy_file
      failed_when:
        - file.required | default(false)
        - copy_file is failed
