group_list:
  - name: docker
    become: true

user_list:
  - name: "{{ ansible_user }}"
    groups: [docker]
    become: true

keyring_dir: /etc/apt/keyrings
docker_keyring: "{{ keyring_dir }}/docker.asc"

downloads:
  - url: https://download.docker.com/linux/ubuntu/gpg
    dest: "{{ docker_keyring }}"

files:
  - path: "{{ lookup('env', 'HOME') }}/repos"
    state: directory
  - src: .gitconfig
    dest: "{{ lookup('env', 'HOME') }}/.gitconfig"
    cp: true
  - src: .bashrc
    dest: "{{ lookup('env', 'HOME') }}/.bashrc"
    cp: true
  - src: .bash_aliases
    dest: "{{ lookup('env', 'HOME') }}/.bash_aliases"
    cp: true
  - src: .bash_variables
    dest: "{{ lookup('env', 'HOME') }}/.bash_variables"
    cp: true
  - src: sshd_config
    dest: /etc/ssh/sshd_config
    cp: true
    become: true
  - path: "{{ keyring_dir }}"
    state: directory
    mode: '0755'
  - path: "{{ docker_keyring }}"
    state: directory
    mode: 'a+r'
  - dest: "{{ lookup('env', 'HOME') }}/.hushlogin"
    content: ''
    cp: true

virtualenv_path: ~/venv

apt_repositories:
  - repo: deb https://download.docker.com/linux/ubuntu {{ ansible_facts.lsb.codename }} stable {{ 'amd64' if ansible_architecture == 'x86_64' else '' }} {{ docker_keyring }}

apt:
  - curl
  - ca-certificates
  - python3-pip
  - python3-venv

pip:
  - ansible
